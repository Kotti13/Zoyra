    const rr = root.getBoundingClientRect(), k = root.offsetHeight / (rr.height || 1);
    const relY = (e.clientY - rr.top) * k;
    let sheet = null;
    const handle = Array.prototype.find.call(root.querySelectorAll('div'), d => /width:\s*40px;\s*height:\s*4px/.test(d.getAttribute('style') || ''));
    if (handle) sheet = handle.parentElement;
    if (sheet) { const sr = sheet.getBoundingClientRect(); if ((e.clientY - sr.top) * k > 110 || e.clientY < sr.top) { return; } drag = { mode: 'sheet', el: sheet, root, y0: e.clientY, k }; }

    if (!drag) return;
    const dy = (e.clientY - drag.y0) * drag.k;
    if (dy < 0) { drag.dy = 0; return; }

    if (!drag.active) return;
    drag.dy = dy;
    const el = drag.el; el.style.transition = 'none'; el.style.animation = 'none'; el.style.userSelect = 'none';
    if (drag.mode === 'sheet') { el.style.transform = 'translateY(' + dy + 'px)'; el.style.opacity = String(Math.max(0.3, 1 - dy / 500)); }

  }, true);
  function endDrag() {
    if (!drag) return; const d = drag; drag = null;
    if (!d.active) { moved = false; return; }
    setTimeout(() => { moved = false; }, 60);
    const el = d.el, fast = d.dy / Math.max(1, Date.now() - d.t0) > 0.6;
    const link = dismissLink(d.root);
    if (d.dy > 110 || (fast && d.dy > 50)) {
      el.style.transition = 'transform .26s cubic-bezier(.4,0,.6,1),opacity .26s';
      el.style.transform = d.mode === 'sheet' ? 'translateY(110%)' : 'translateY(60px) scale(.96)'; el.style.opacity = '0';
      setTimeout(() => {
        if (link) goLink(link);
        setTimeout(() => { el.style.transition = 'transform .35s cubic-bezier(.3,1.3,.5,1),opacity .3s'; el.style.transform = ''; el.style.opacity = ''; }, link ? 700 : 450);
      }, 240);
    } else {
      el.style.transition = 'transform .35s cubic-bezier(.3,1.5,.5,1),opacity .25s'; el.style.transform = ''; el.style.opacity = '';
    }
  }

  doc.addEventListener('pointercancel', endDrag, true);

  const HEART = 'M12 20s-7-4.5-7-10';
  const st = doc.createElement('style');
  st.textContent = '@keyframes zpPop{0%{transform:scale(1)}30%{transform:scale(1.55)}60%{transform:scale(.86)}100%{transform:scale(1)}}@keyframes zpBurst{0%{opacity:1;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2)}}@keyframes zpRing{0%{opacity:.8;transform:scale(.6)}100%{opacity:0;transform:scale(2.3)}}@keyframes zpToast{0%{opacity:0;transform:translate(-50%,16px) scale(.9)}12%{opacity:1;transform:translate(-50%,0) scale(1)}85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-8px)}}.zp-pop{animation:zpPop .5s cubic-bezier(.3,1.6,.5,1)}button:active{transform:scale(.92)}';
  doc.head.appendChild(st);
  const ACC = '#FF4D6A';
  function kindOf(el) {
    const txt = (el.textContent || '').trim(), lab = el.getAttribute('aria-label') || '';
    if (/^(follow|following)$/i.test(txt) || /\bfollow/i.test(lab)) return 'follow';
    if (/^(save|saved|my list)$/i.test(txt) || /\b(save|saved|bookmark)\b/i.test(lab)) return 'save';
    const hasHeart = Array.prototype.some.call(el.querySelectorAll('path'), p => (p.getAttribute('d') || '').indexOf(HEART) === 0);
    if ((hasHeart || /\b(like|liked|favou?rite)\b/i.test(lab)) && el.querySelectorAll('svg').length <= 2 && txt.length <= 14 && el.offsetWidth <= 220) return 'like';
    return null;
  }
  function burst(el, glyph, color, n) {
    if (getComputedStyle(el).position === 'static') el.style.position = 'relative';
    el.style.overflow = 'visible';
    const ring = doc.createElement('span');
    ring.style.cssText = 'position:absolute;left:0;top:0;right:0;bottom:0;border-radius:999px;border:2px solid ' + color + ';pointer-events:none;animation:zpRing .6s ease-out forwards';
    el.appendChild(ring); setTimeout(() => ring.remove(), 700);
    for (let i = 0; i < n; i++) {
      const a = (Math.PI * 2 * i) / n + Math.random() * 0.5, r = 26 + Math.random() * 22;
      const p = doc.createElement('span');
      p.textContent = glyph;
      p.style.cssText = 'position:absolute;left:50%;top:50%;margin:-7px 0 0 -7px;font-size:' + (10 + Math.random() * 8) + 'px;line-height:14px;color:' + color + ';pointer-events:none;--dx:' + Math.cos(a) * r + 'px;--dy:' + Math.sin(a) * r + 'px;animation:zpBurst .75s ease-out forwards';
      el.appendChild(p); setTimeout(() => p.remove(), 850);
    }
  }
  function toast(root, msg) {
    const old = root.querySelector('[data-zptoast]'); if (old) old.remove();
    const t = doc.createElement('div');
    t.setAttribute('data-zptoast', '1');
    t.textContent = msg;
    t.style.cssText = 'position:absolute;left:50%;bottom:120px;z-index:99;height:40px;padding:0 18px;border-radius:20px;display:flex;align-items:center;font:600 13px Inter,system-ui,sans-serif;color:#fff;background:rgba(20,20,20,0.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.18);box-shadow:0 8px 28px rgba(0,0,0,0.5);white-space:nowrap;pointer-events:none;animation:zpToast 1.9s ease forwards';
    root.appendChild(t); setTimeout(() => t.remove(), 2000);
  }
  function swapText(el, test, to) {
    const w = doc.createTreeWalker(el, NodeFilter.SHOW_TEXT); let n;
    while ((n = w.nextNode())) { if (test.test(n.nodeValue)) { n.nodeValue = to; return; } }
  }
  function handle(el, k, root, e) {
    const on = el.getAttribute('data-zp') !== '1';
    el.setAttribute('data-zp', on ? '1' : '0');
    const href = el.getAttribute && el.getAttribute('href');

    el.classList.remove('zp-pop'); void el.offsetWidth; el.classList.add('zp-pop');

      el.querySelectorAll('svg').forEach(s => {
        if (!s.hasAttribute('data-zo')) s.setAttribute('data-zo', [s.getAttribute('fill'), s.getAttribute('fill-opacity'), s.getAttribute('stroke'), el.style.color].join('|'));
        if (on) { s.setAttribute('fill', ACC); s.setAttribute('fill-opacity', '1'); s.setAttribute('stroke', ACC); }
        else { const o = s.getAttribute('data-zo').split('|'); s.setAttribute('fill', o[0] || 'none'); if (o[1]) s.setAttribute('fill-opacity', o[1]); else s.removeAttribute('fill-opacity'); s.setAttribute('stroke', o[2] || 'currentColor'); }
      });
      if (on) { burst(el, '♥', ACC, 8); }
      toast(root, on ? 'Added to Liked songs' : 'Removed from Liked songs');
    } else if (k === 'follow') {
      if (!el.hasAttribute('data-zs')) el.setAttribute('data-zs', el.getAttribute('style') || '');
      swapText(el, /follow/i, on ? 'Following' : 'Follow');
      if (on) { el.style.background = 'rgba(255,255,255,0.14)'; el.style.color = '#fff'; el.style.border = '1.5px solid rgba(255,255,255,0.4)'; el.style.boxShadow = 'none'; burst(el, '✦', ACC, 7); }
      else el.setAttribute('style', el.getAttribute('data-zs'));
      toast(root, on ? 'You are now following' : 'Unfollowed');
    } else if (k === 'save') {
      const s = el.querySelector('svg');
      if (s) { if (!s.hasAttribute('data-zh')) s.setAttribute('data-zh', s.innerHTML); s.innerHTML = on ? '<path d="M5 12.5l4.5 4.5L19 7.5"/>' : s.getAttribute('data-zh'); }
      swapText(el, /^\s*(save|saved)\s*$/i, on ? 'Saved' : 'Save');
      el.style.color = on ? '#FF7A8C' : '';
      if (on) burst(el, '✦', ACC, 6);
      toast(root, on ? 'Saved to your library' : 'Removed from library');
    }
  }
  doc.addEventListener('click', function (e) {
    const path = e.composedPath ? e.composedPath() : [e.target];
    let root = null, found = null, depth = 0;
    for (let i = 0; i < path.length; i++) {
      const n = path[i]; if (!n || n.nodeType !== 1) continue;
      if (!root && /width:\s*(390|844)px/.test(n.getAttribute('style') || '')) root = n;
      if (!found && depth < 7 && /^(BUTTON|A|SPAN)$/.test(n.tagName) || (n.getAttribute && n.getAttribute('role') === 'button')) {
        if (!found) { const k = kindOf(n); if (k) found = { n, k }; }
      }
      depth++;
    }
    if (found) handle(found.n, found.k, root || doc.body, e);
  }, true);
}

renderVals() {
  const c = ['linear-gradient(135deg,#6C5CE7,#2A1F7A)','linear-gradient(135deg,#00CEC9,#0B4F55)','linear-gradient(135deg,#FF6B81,#5A1B3A)','linear-gradient(135deg,#FDCB6E,#5C3A12)','linear-gradient(135deg,#74B9FF,#16305F)','linear-gradient(135deg,#00B894,#0F4A3A)'];
