      el.querySelectorAll('svg').forEach(s => {
        if (!s.hasAttribute('data-zo')) s.setAttribute('data-zo', [s.getAttribute('fill'), s.getAttribute('fill-opacity'), s.getAttribute('stroke'), el.style.color].join('|'));
        if (on) { s.setAttribute('fill', ACC); s.setAttribute('fill-opacity', '1'); s.setAttribute('stroke', ACC); }
        else { const o = s.getAttribute('data-zo').split('|'); s.setAttribute('fill', o[0] || 'none'); if (o[1]) s.setAttribute('fill-opacity', o[1]); else s.removeAttribute('fill-opacity'); s.setAttribute('stroke', o[2] || 'currentColor'); }
      });
      if (on) { burst(el, '♥', ACC, 8); }
      toast(root, on ? 'Added to Liked songs' : 'Removed from Liked songs');
    } else if (k === 'follow') {
      if (!el.hasAttribute('data-zs')) el.setAttribute('data-zs', el.getAttribute('style') || '');
      swapText(el, /follow/i, on ? 'Following' : 'Follow');
      if (on) { el.style.background = 'rgba(255,255,255,0.14)'; el.style.color = '#fff'; el.style.border = '1.5px solid rgba(255,255,255,0.4)'; el.style.boxShadow = 'none'; burst(el, '✦', ACC, 7); }
      else el.setAttribute('style', el.getAttribute('data-zs'));
      toast(root, on ? 'You are now following' : 'Unfollowed');
    } else if (k === 'save') {
      const s = el.querySelector('svg');
      if (s) { if (!s.hasAttribute('data-zh')) s.setAttribute('data-zh', s.innerHTML); s.innerHTML = on ? '<path d="M5 12.5l4.5 4.5L19 7.5"/>' : s.getAttribute('data-zh'); }
      swapText(el, /^\s*(save|saved)\s*$/i, on ? 'Saved' : 'Save');
      el.style.color = on ? '#FF7A8C' : '';
      if (on) burst(el, '✦', ACC, 6);
      toast(root, on ? 'Saved to your library' : 'Removed from library');
    }
  }
  doc.addEventListener('click', function (e) {
    const path = e.composedPath ? e.composedPath() : [e.target];
    let root = null, found = null, depth = 0;
    for (let i = 0; i < path.length; i++) {
      const n = path[i]; if (!n || n.nodeType !== 1) continue;
      if (!root && /width:\s*(390|844)px/.test(n.getAttribute('style') || '')) root = n;
      if (!found && depth < 7 && /^(BUTTON|A|SPAN)$/.test(n.tagName) || (n.getAttribute && n.getAttribute('role') === 'button')) {
        if (!found) { const k = kindOf(n); if (k) found = { n, k }; }
      }
      depth++;
    }
    if (found) handle(found.n, found.k, root || doc.body, e);
  }, true);
}

renderVals() {
  const c = ['linear-gradient(135deg,#FA2D48,#3A0B16)','linear-gradient(135deg,#FF6F91,#4A0D14)','linear-gradient(135deg,#FF6B81,#5A1B3A)','linear-gradient(135deg,#FDCB6E,#5C3A12)','linear-gradient(135deg,#74B9FF,#16305F)','linear-gradient(135deg,#00B894,#0F4A3A)'];
  return Object.assign({ accent: this.props.accent ?? '#FA2D48' }, {});
}
}
