[project]
name = "zoyra-gateway"
version = "0.1.0"
description = "Zoyra API gateway: one backend in front of every third-party provider."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.4,<3",
  "PyJWT[crypto]>=2.9,<3",
  "redis>=5.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools]
packages = ["app", "app.routers"]
